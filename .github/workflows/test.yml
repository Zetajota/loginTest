name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar sintaxis de la pantalla de perfil
        run: node --check profile.js
      - name: Ejecutar cinco pruebas de autenticación
        run: npm test
